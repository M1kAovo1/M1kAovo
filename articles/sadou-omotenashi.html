<!-- 1.茶道介绍 -->
<h2>茶道とおもてなし</h2>

<p>
    茶道は、日本の伝統文化の一つです。
    亭主は、お客様を迎え、
    心を込めてお茶を点てる。
</p>

<p>
    茶会は、お茶の味だけでなく、
    茶室の雰囲気や季節の花なども大切にされます。
</p>

<!-- 2.一期一会 -->
<h2>一期一会</h2>

<p>
    <ruby>一期一会<rt>いちごいちえ</rt></ruby>
    は、一度きりの出会いや時間を大切にするという考え方です。
</p>

<p>
    この考え方は、茶道だけでなく、
    私たちの日常生活にもつながっています。
</p>

<!-- 3.单词 -->
<h2>言葉のメモ</h2>

<ul>
    <li>亭主（ていしゅ）：主人、茶会的主持人</li>
    <li>点てる（たてる）：沏抹茶</li>
    <li>心を込める：倾注心意</li>
</ul>
